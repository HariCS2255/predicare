{% extends 'core/base.html' %}
{% load static %}

{% block title %}Register | PrediCare{% endblock %}

{% block content %}

<div class="container-fluid py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="bg-light rounded p-5 shadow">

                    <div class="text-center mb-4">
                        <h2 class="text-primary">Create Your PrediCare Account</h2>
                        <p class="text-muted">Start your AI-powered health journey</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" name="first_name" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" name="last_name" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password"
                                       name="password1"
                                       id="password1"
                                       class="form-control"
                                       required>

                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('password1', 'icon1')">
                                    <i class="fas fa-eye" id="icon1"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <input type="password"
                                       name="password2"
                                       id="password2"
                                       class="form-control"
                                       required>

                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('password2', 'icon2')">
                                    <i class="fas fa-eye" id="icon2"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Register
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <small>
                            Already have an account?
                            <a href="{% url 'login' %}" class="text-primary">Login</a>
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Show Password Script -->
<script>
function togglePassword(fieldId, iconId) {
    const passwordField = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);

    if (passwordField.type === "password") {
        passwordField.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        passwordField.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

{% endblock %}
